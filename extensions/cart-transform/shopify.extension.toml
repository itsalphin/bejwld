# bejwld — Cart Transform Function
# Enforces the configurator price server-side. The client only ever shows an
# estimate; THIS is what the shopper is charged. It reads the hidden `_config`
# attribute written to each configured cart line and recomputes the unit price
# from the pricing tables in `src/pricing-tables.js` (a deliberate mirror of the
# app's `app/lib/catalog/pricing.ts`).
#
# Deploy (requires a Shopify store + Shopify CLI, from the project root):
#   shopify app deploy
# Then, in the Shopify admin, run/activate the Cart Transform via the app.

api_version = "2025-01"

[[extensions]]
name = "bejwld-cart-transform"
handle = "bejwld-cart-transform"
type = "function"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/run.graphql"
  export = "run"
